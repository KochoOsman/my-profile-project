     <!-- CONTACT SECTION -->
    <section id="contact" class="contact">

        <h2>Contact Me</h2>

        <form id="contactForm">

            <input
                type="text"
                placeholder="Full Name"
                required
            />

            <input
                type="email"
                placeholder="Email Address"
                required
            />

            <input
                type="text"
                placeholder="Subject"
                required
            />

            <textarea
                placeholder="Write your message or application..."
                rows="6"
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>
